name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly Friday 5AM build
    # * is a special character in YAML so you have to quote this string
    - cron: '0 5 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'
    - name: Install and build
      run: python -m pip install tox --upgrade
    - name: Run tests
      run: tox -e py312-test

  devtests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.13'
    - name: Install and build
      run: python -m pip install tox --upgrade
    - name: Run tests
      run: tox -e py313-test-devdeps

  pixi:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
      with:
        run-install: false
    - name: Set up pixi environment
      run: pixi install
    - name: Run tests (pixi)
      run: pixi run test

  pixi-downstream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
      with:
        run-install: false
    - name: Create downstream project
      run: |
        mkdir downstream && cd downstream
        pixi init
    - name: Add dependencies (simulate user env)
      working-directory: downstream
      run: pixi add numpy scipy astropy ipywidgets
    - name: Add local package
      working-directory: downstream
      run: pixi add --pypi "astrowidgets @ file://$GITHUB_WORKSPACE"
    - name: Install and verify
      working-directory: downstream
      run: |
        pixi install
        pixi run python -c "import astrowidgets"
